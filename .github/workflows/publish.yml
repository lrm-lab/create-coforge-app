# Publishes to npm with trusted publishing (OIDC): no NPM_TOKEN secret exists or is needed.
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions ->
# organization lrm-lab, repository create-coforge-app, workflow filename publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.21.1
      - name: The tag must equal package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: npm test
      - name: Scaffold, install and test every template (Node and Bun)
        run: E2E=1 npm test
      # Provenance attestations are generated automatically when publishing through trusted publishing
      # from a public repository, so no --provenance flag: https://docs.npmjs.com/trusted-publishers
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --access public --tag next ;; # a prerelease never becomes "latest"
            *)   npm publish --access public ;;
          esac
